<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="#0A1628"/>
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bgGrad)" opacity="0.12"/>
  <rect x="4" y="4" width="112" height="112" rx="28" fill="none" stroke="url(#bgGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- Pill capsule icon, rotated 45deg -->
  <g transform="translate(60,60) rotate(-45)" filter="url(#glow)">
    <rect x="-30" y="-11" width="60" height="22" rx="11" fill="url(#pillGrad)"/>
    <rect x="-30" y="-11" width="30" height="22" rx="11" fill="url(#bgGrad)"/>
    <line x1="0" y1="-11" x2="0" y2="11" stroke="#06070C" stroke-width="1" opacity="0.15"/>
  </g>

  <!-- Small cross accent, top right -->
  <g transform="translate(86,34)">
    <circle cx="0" cy="0" r="10" fill="#0A1628" stroke="url(#bgGrad)" stroke-width="1.5"/>
    <rect x="-4" y="-1.2" width="8" height="2.4" rx="1.2" fill="url(#bgGrad)"/>
    <rect x="-1.2" y="-4" width="2.4" height="8" rx="1.2" fill="url(#bgGrad)"/>
  </g>
</svg>
